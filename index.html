<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Woodshed</title>
<meta name="description" content="Chase Morrin's piano practice tracker.">

<!-- Icons: browser tab, iPhone home screen, Android/PWA -->
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Woodshed">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0e">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: pinned black fallboard (top-3 tunes | top-3 drills, keyboard strip) + tab bar carrying
   the tune of the day; below, one column per tab: leaderboard → add → up next → archive (→ drill of the day). */
:root{
  --paper:#f6f5f1; --ink:#0d0d0e; --muted:#6b6a66; --line:#d8d6cf; --surface:#ffffff; --raised:#ecebe6;
  --inv-bg:#0d0d0e; --inv-fg:#f6f5f1; --ivory:#fbfaf6; --ebony:#0d0d0e; --key-edge:#bdbab2;
  --font:"Figtree","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0b0b0c; --ink:#f1f0ec; --muted:#9a9893; --line:#2b2b2d; --surface:#131314; --raised:#1d1d1f;
  --inv-bg:#f1f0ec; --inv-fg:#0b0b0c; --ivory:#f3f1ea; --ebony:#050505; --key-edge:#8f8c85; color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Pinned header */
.pinned{position:sticky;top:0;z-index:10}
.fallboard{background:var(--ebony);color:#f3f1ea;padding-top:env(safe-area-inset-top,0px)}
.fb-inner{max-width:760px;margin:0 auto;padding-top:14px}
.stand{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.stand .col{min-width:0;cursor:pointer;border-radius:2px}
.stand .col h3{margin:0 0 6px;font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#a9a69f;display:flex;justify-content:space-between}
.stand .col.on h3{color:#f3f1ea}
.stand ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.stand li{display:grid;grid-template-columns:16px 1fr;gap:6px;font-size:.9rem;line-height:1.3;font-weight:500;min-width:0}
.stand li .n{color:#7f7c76;font-variant-numeric:tabular-nums;font-weight:600}
.stand li .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.stand li.open .nm{color:#6d6a65;font-weight:400}
.keys{display:block;width:100%;height:16px;margin-top:12px}
.keys rect{transition:transform .12s ease, fill .12s ease;transform-box:fill-box;transform-origin:top}
.keys .w{fill:var(--ivory);stroke:var(--key-edge);stroke-width:.6}
.keys .b{fill:var(--ebony);stroke:#000;stroke-width:.6}
.keys .down.w{fill:#dcd9d0;transform:scaleY(.97)}
.keys .down.b{fill:#3a3a3c;transform:scaleY(.95)}

/* Tab bar with tune of the day */
.tabs-wrap{background:var(--paper);border-bottom:1px solid var(--line)}
.tabs{max-width:760px;margin:0 auto;display:flex;align-items:stretch;gap:4px}
.tab{appearance:none;background:none;border:0;padding:14px 4px 12px;margin-right:16px;cursor:pointer;font-size:.78rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;flex:none}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .ct{font-variant-numeric:tabular-nums;margin-left:6px;opacity:.7}
.today{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;padding-left:8px}
.today .txt{min-width:0;display:grid;line-height:1.2;text-align:right}
.today .lbl{font-size:.6rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.today .nm{font-size:.92rem;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.today .nm.anim{animation:rise .4s ease}
.reroll{appearance:none;border:1px solid var(--line);background:transparent;border-radius:50%;width:30px;height:30px;flex:none;display:grid;place-items:center;cursor:pointer;font-size:.95rem;line-height:1;color:var(--ink)}
.reroll:hover{border-color:var(--ink)}
.reroll:disabled{opacity:.35;cursor:default}
@media (max-width:480px){.tab{letter-spacing:.08em;margin-right:8px}.tab .ct{margin-left:4px}}

main{max-width:760px;margin:0 auto;padding-top:28px;padding-bottom:64px;display:grid;gap:44px}
section{display:grid;gap:14px;min-width:0}
.eyebrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.eyebrow h2{margin:0;font-weight:600;font-size:1.2rem;line-height:1.2;letter-spacing:-.01em}
.eyebrow .meta{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:.9rem;margin:0}

/* Leaderboard */
.board{display:grid;gap:10px}
.slot{display:grid;grid-template-columns:64px 1fr;min-height:84px;border:1px solid var(--ink);background:var(--surface)}
.slot .rank{background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center;font-size:1.7rem;font-weight:500}
.slot .body{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 18px;flex-wrap:wrap;min-width:0}
.slot .name{font-weight:500;line-height:1.15;overflow-wrap:anywhere;min-width:0;flex:1 1 220px}
.slot[data-r="1"] .name{font-size:1.3rem}
.slot[data-r="2"] .name{font-size:1.15rem}
.slot[data-r="3"] .name{font-size:1.05rem}
.slot .note{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}
.slot.empty{border-style:dashed;border-color:var(--line);background:transparent}
.slot.empty .rank{background:var(--raised);color:var(--muted)}
.slot.empty .body{color:var(--muted);font-size:.92rem}

/* Of-the-day card (drills tab) */
.totd{border:1px solid var(--ink);display:grid;gap:14px;padding:22px}
.totd .row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.totd .lbl{font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:12px}
.totd .pick{font-size:clamp(1.5rem,5vw,2rem);font-weight:600;letter-spacing:-.015em;line-height:1.15;overflow-wrap:anywhere;min-width:0;flex:1 1 240px}
.totd .pick small{display:block;font-size:.88rem;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:4px}
.totd .pick.anim{animation:rise .45s ease}

/* Buttons */
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:transparent;padding:7px 11px;border-radius:2px;cursor:pointer;font-size:.7rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;line-height:1.2;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.solid{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.btn.solid:hover{opacity:.88}
.btn.warn{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default}
.btn.icon{padding:7px 9px}

/* Add form */
form.add{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
form.add input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);padding:11px 12px;border-radius:2px;font-size:1rem}
form.add input:focus{border-color:var(--ink);outline:none}
form.add .btn{padding:0 18px}
@media (max-width:560px){form.add{grid-template-columns:1fr}form.add .btn{padding:12px}}

/* Lists */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list .t{min-width:0;flex:1 1 200px}
.list .t b{font-weight:500;overflow-wrap:anywhere}
.list .t small{display:block;color:var(--muted);font-size:.82rem}
.list .pos{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;width:2.2em;flex:none}
.empty-line{color:var(--muted);font-size:.92rem;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

details.archive summary{cursor:pointer;list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive summary .eyebrow h2::after{content:" +";font-size:1rem;color:var(--muted)}
details.archive[open] summary .eyebrow h2::after{content:" –"}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--inv-bg);color:var(--inv-fg);padding:10px 16px;font-size:.88rem;border-radius:2px;max-width:calc(100% - 32px);z-index:20}
.loading{color:var(--muted);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.mode{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;margin:0}
.sync{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7f7c76;margin-left:8px;vertical-align:middle;opacity:0;transition:opacity .2s}
.sync.on{opacity:1;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="pinned">
  <header class="fallboard">
    <div class="fb-inner gutter">
      <div class="stand" aria-label="Currently practicing">
        <div class="col" id="pin-tunes" data-tab="tunes" role="button" tabindex="0"><h3><span>Tunes<span class="sync" id="sync"></span></span><span>Top 3</span></h3><ol></ol></div>
        <div class="col" id="pin-drills" data-tab="drills" role="button" tabindex="0"><h3><span>Drills</span><span>Top 3</span></h3><ol></ol></div>
      </div>
      <svg class="keys" id="keys" viewBox="0 0 504 78" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
  </header>
  <div class="tabs-wrap">
    <nav class="tabs gutter" role="tablist">
      <button class="tab" role="tab" id="tab-tunes" data-tab="tunes" aria-selected="true">Tunes<span class="ct" id="ct-tunes"></span></button>
      <button class="tab" role="tab" id="tab-drills" data-tab="drills" aria-selected="false">Drills<span class="ct" id="ct-drills"></span></button>
      <div class="today" aria-live="polite">
        <div class="txt"><span class="lbl">Tune of the day</span><span class="nm" id="tod-name">—</span></div>
        <button class="reroll" id="tod-reroll" aria-label="Change tune of the day" title="Change tune of the day">↻</button>
      </div>
    </nav>
  </div>
</div>

<main id="app" class="gutter"><p class="loading">Tuning up…</p></main>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>
(() => {
  /* ---------- keyboard strip ---------- */
  const svg = document.getElementById('keys'), NS = 'http://www.w3.org/2000/svg';
  const keyEls = [];
  for (let i = 0; i < 21; i++) {
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', i * 24); r.setAttribute('y', 0); r.setAttribute('width', 24); r.setAttribute('height', 78);
    r.setAttribute('class', 'w'); svg.appendChild(r); keyEls.push(r);
  }
  for (let i = 0; i < 21; i++) {
    if (![0, 1, 3, 4, 5].includes(i % 7) || i === 20) continue;
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', (i + 1) * 24 - 7); r.setAttribute('y', 0); r.setAttribute('width', 14); r.setAttribute('height', 48);
    r.setAttribute('class', 'b'); svg.appendChild(r); keyEls.push(r);
  }
  function strike(n = 3) {
    for (let k = 0; k < n; k++) {
      const el = keyEls[Math.floor(Math.random() * keyEls.length)];
      setTimeout(() => { el.classList.add('down'); setTimeout(() => el.classList.remove('down'), 260); }, k * 90);
    }
  }

  /* ---------- config ---------- */
  const KINDS = {
    tunes: {
      col: 'songs', noun: 'tune', boardTitle: 'On the Stand', archiveTitle: 'Learned Tunes',
      namePh: 'Tune — e.g. Stella by Starlight', notePh: 'Composer or key (optional)',
      emptySlot: 'Open chair. Add a tune or start one from Up Next.'
    },
    drills: {
      col: 'drills', noun: 'drill', boardTitle: 'In the Practice Room', archiveTitle: 'Learned Drills',
      namePh: 'Drill — e.g. Drop 2 voicings', notePh: 'Detail, keys or source (optional)',
      emptySlot: 'Open slot. Add a drill or start one from Up Next.'
    }
  };
  const TOP = 3;
  const API = (window.WOODSHED_API || '').trim();
  const LIVE = /^https:\/\/script\.google\.com\//.test(API);

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  // "Today" follows the sheet's clock (New York) once it has answered, so the site and widget agree.
  const todayKey = () => { if (state.today && Date.now() - (state.todayAt || 0) < 6 * 3600e3) return state.today; return localToday(); };
  const localToday = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };

  const state = { songs: [], drills: [], daily: { songs: null, drills: null } };
  const ui = { tab: 'tunes', anim: { songs: false, drills: false }, confirm: null, archiveOpen: { songs: false, drills: false }, loaded: false };
  try { const h = location.hash.replace('#', ''); if (KINDS[h]) ui.tab = h; else { const t = localStorage.getItem('woodshed-tab'); if (KINDS[t]) ui.tab = t; } } catch (e) {}

  /* ---------- storage: Google Sheet (live) or this browser (demo) ---------- */
  const LS = 'woodshed-data-v2';
  const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} };
  const loadLocal = () => { try { const d = JSON.parse(localStorage.getItem(LS) || 'null'); if (d) Object.assign(state, d); } catch (e) {} };

  let pending = 0, chain = Promise.resolve();
  const syncDot = document.getElementById('sync');
  const setSync = () => syncDot.classList.toggle('on', pending > 0);

  function applyServer(d) {
    if (!d || d.error) return;
    state.songs = d.songs || []; state.drills = d.drills || [];
    state.daily = d.daily || { songs: null, drills: null };
    if (d.today) { state.today = d.today; state.todayAt = Date.now(); }
  }
  async function fetchAll() {
    if (!LIVE) { loadLocal(); ui.loaded = true; render(); return; }
    try {
      const r = await fetch(API + '?action=all&t=' + Date.now(), { redirect: 'follow' });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      if (pending === 0) { applyServer(d); saveLocal(); }
      ui.loaded = true; render();
    } catch (e) {
      if (!ui.loaded) { loadLocal(); ui.loaded = true; render(); }
      toast('Couldn’t reach your Google Sheet. Showing the last saved copy.');
    }
  }
  // Every change is applied on screen first, then sent to the sheet in order.
  function send(payload) {
    saveLocal(); render();
    if (!LIVE) return;
    pending++; setSync();
    chain = chain.then(async () => {
      try {
        const r = await fetch(API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        pending--; setSync();
        if (pending === 0) { applyServer(d); saveLocal(); render(); }
      } catch (e) {
        pending--; setSync();
        toast('That change didn’t reach your sheet. Reloading the latest copy.');
        if (pending === 0) fetchAll();
      }
    });
  }

  /* ---------- derived ---------- */
  const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || (a.added ?? 0) - (b.added ?? 0);
  function views(col) {
    const active = state[col].filter(x => x.status !== 'learned').sort(byOrder);
    const learned = state[col].filter(x => x.status === 'learned').sort((a, b) => (b.learnedAt ?? 0) - (a.learnedAt ?? 0));
    return { board: active.slice(0, TOP), queue: active.slice(TOP), active, learned };
  }
  function ofTheDay(col) {
    const cat = [...state[col]].sort((a, b) => String(a.id) < String(b.id) ? -1 : 1);
    if (!cat.length) return null;
    const d = state.daily[col], today = todayKey();
    if (d && d.date === today) { const hit = cat.find(x => x.id === d.id); if (hit) return hit; }
    return cat[hash(today + col) % cat.length];
  }
  function reroll(col) {
    const cur = ofTheDay(col), pool = state[col].filter(x => !cur || x.id !== cur.id);
    if (!pool.length) return;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    state.daily[col] = { date: todayKey(), id: pick.id };
    ui.anim[col] = true; strike(3);
    send({ action: 'setDaily', col, date: todayKey(), id: pick.id });
  }
  const fmtDate = ms => ms ? new Date(ms).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }) : '';

  /* ---------- render ---------- */
  const app = document.getElementById('app');
  const todName = document.getElementById('tod-name'), todBtn = document.getElementById('tod-reroll');
  function render() {
    for (const [k, cfg] of Object.entries(KINDS)) {
      const v = views(cfg.col);
      document.getElementById('ct-' + k).textContent = v.active.length ? v.active.length : '';
      document.getElementById('tab-' + k).setAttribute('aria-selected', String(ui.tab === k));
      const pin = document.getElementById('pin-' + k);
      pin.classList.toggle('on', ui.tab === k);
      pin.querySelector('ol').innerHTML = [0, 1, 2].map(i => {
        const it = v.board[i];
        return `<li class="${it ? '' : 'open'}"><span class="n">${i + 1}</span><span class="nm">${it ? esc(it.name) : '—'}</span></li>`;
      }).join('');
    }
    const tune = ofTheDay('songs');
    todName.textContent = tune ? tune.name : 'Add a tune';
    todName.title = tune ? tune.name : '';
    todName.classList.toggle('anim', ui.anim.songs); ui.anim.songs = false;
    todBtn.disabled = state.songs.length < 2;

    if (!ui.loaded) return;
    const cfg = KINDS[ui.tab], col = cfg.col, v = views(col);
    const confirmBtn = id => ui.confirm === col + ':' + id
      ? `<button class="btn warn" data-a="del" data-id="${esc(id)}">Confirm</button>`
      : `<button class="btn icon" data-a="askdel" data-id="${esc(id)}" aria-label="Delete" title="Delete">✕</button>`;

    const slots = [0, 1, 2].map(i => {
      const it = v.board[i];
      if (!it) return `<div class="slot empty" data-r="${i + 1}"><div class="rank">${i + 1}</div><div class="body">${esc(cfg.emptySlot)}</div></div>`;
      return `<div class="slot" data-r="${i + 1}"><div class="rank">${i + 1}</div><div class="body">
        <div class="name">${esc(it.name)}${it.note ? `<span class="note">${esc(it.note)}</span>` : ''}</div>
        <div class="acts">
          <button class="btn solid" data-a="learn" data-id="${esc(it.id)}">✓ Learned</button>
          <button class="btn icon" data-a="up" data-id="${esc(it.id)}" ${i === 0 ? 'disabled' : ''} aria-label="Move up" title="Move up">↑</button>
          <button class="btn icon" data-a="down" data-id="${esc(it.id)}" ${i === v.active.length - 1 ? 'disabled' : ''} aria-label="Move down" title="Move down">↓</button>
          ${confirmBtn(it.id)}
        </div></div></div>`;
    }).join('');

    const queue = v.queue.length ? `<ol class="list">${v.queue.map((it, i) => `<li>
        <span class="pos">${String(i + TOP + 1).padStart(2, '0')}</span>
        <div class="t"><b>${esc(it.name)}</b>${it.note ? `<small>${esc(it.note)}</small>` : ''}</div>
        <div class="acts">
          <button class="btn" data-a="start" data-id="${esc(it.id)}">Start now</button>
          <button class="btn icon" data-a="up" data-id="${esc(it.id)}" aria-label="Move up" title="Move up">↑</button>
          <button class="btn icon" data-a="learn" data-id="${esc(it.id)}" aria-label="Mark learned" title="Mark learned">✓</button>
          ${confirmBtn(it.id)}
        </div></li>`).join('')}</ol>`
      : `<div class="empty-line">Nothing waiting. New ${cfg.noun}s land here once the top three are full.</div>`;

    const archive = `<details class="archive" ${ui.archiveOpen[col] ? 'open' : ''} data-col="${col}">
        <summary><div class="eyebrow"><h2>${esc(cfg.archiveTitle)}</h2><span class="meta">${v.learned.length}</span></div></summary>
        ${v.learned.length ? `<ul class="list">${v.learned.map(it => `<li>
            <div class="t"><b>${esc(it.name)}</b><small>${[it.note, it.learnedAt ? 'Learned ' + fmtDate(it.learnedAt) : ''].filter(Boolean).map(esc).join(' · ')}</small></div>
            <div class="acts">
              <button class="btn" data-a="revive" data-id="${esc(it.id)}">Revisit</button>
              ${confirmBtn(it.id)}
            </div></li>`).join('')}</ul>`
          : `<div class="empty-line">Your learned ${cfg.noun}s will collect here.</div>`}
      </details>`;

    let drillOfDay = '';
    if (col === 'drills') {
      const d = ofTheDay('drills');
      const status = d ? (d.status === 'learned' ? 'From your learned drills' : (v.board.some(x => x.id === d.id) ? 'In your top three now' : 'In Up Next')) : '';
      drillOfDay = `<section class="totd" aria-live="polite">
        <div class="lbl"><span>Drill of the day</span><span>${new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}</span></div>
        ${d ? `<div class="row"><div class="pick ${ui.anim.drills ? 'anim' : ''}">${esc(d.name)}<small>${[d.note, status].filter(Boolean).map(esc).join(' · ')}</small></div>
               <button class="btn solid" data-a="rerollDrill" ${state.drills.length > 1 ? '' : 'disabled'}>Change</button></div>`
            : `<div class="hint">Add a drill and one will be picked from your full list each day.</div>`}
      </section>`;
      ui.anim.drills = false;
    }

    const focusedId = document.activeElement && document.activeElement.id;
    const nameVal = document.getElementById('f-name')?.value || '', noteVal = document.getElementById('f-note')?.value || '';
    app.innerHTML = `
      <section>
        <div class="eyebrow"><h2>${esc(cfg.boardTitle)}</h2><span class="meta">Top 3</span></div>
        <div class="board">${slots}</div>
      </section>
      <section>
        <div class="eyebrow"><h2>Add a ${cfg.noun}</h2><span class="meta">Joins the end of the line</span></div>
        <form class="add" id="addform" autocomplete="off">
          <input id="f-name" name="name" placeholder="${esc(cfg.namePh)}" aria-label="${esc(cfg.noun)} name" required maxlength="140">
          <input id="f-note" name="note" placeholder="${esc(cfg.notePh)}" aria-label="Note" maxlength="140">
          <button class="btn solid" type="submit">Add</button>
        </form>
      </section>
      <section>
        <div class="eyebrow"><h2>Up Next</h2><span class="meta">${v.queue.length} waiting</span></div>
        ${queue}
      </section>
      <section>${archive}</section>
      ${drillOfDay}
      ${LIVE ? '' : `<p class="mode">Demo mode · saved in this browser only · add your Google Sheet link in config.js</p>`}
    `;
    if (nameVal) document.getElementById('f-name').value = nameVal;
    if (noteVal) document.getElementById('f-note').value = noteVal;
    if (focusedId === 'f-name' || focusedId === 'f-note') document.getElementById(focusedId).focus();
  }

  /* ---------- actions ---------- */
  const find = (col, id) => state[col].find(x => x.id === id);
  function patch(col, id, p) { const it = find(col, id); if (it) Object.assign(it, p); send({ action: 'update', col, id, patch: p }); }
  function reorder(col, ids) {
    ids.forEach((id, i) => { const it = find(col, id); if (it) it.order = i + 1; });
    send({ action: 'reorder', col, ids });
  }
  function move(col, id, dir) {
    const ids = views(col).active.map(x => x.id), i = ids.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    reorder(col, ids);
  }
  const maxOrder = col => Math.max(0, ...state[col].map(x => x.order ?? 0));

  app.addEventListener('submit', e => {
    if (e.target.id !== 'addform') return;
    e.preventDefault();
    const col = KINDS[ui.tab].col;
    const name = e.target.name.value.trim(), note = e.target.note.value.trim();
    if (!name) return;
    e.target.name.value = ''; e.target.note.value = '';
    strike(2);
    const item = { id: newId(), name, note, status: 'active', order: maxOrder(col) + 1, added: Date.now(), learnedAt: null };
    state[col].push(item);
    send({ action: 'add', col, item });
  });

  app.addEventListener('toggle', e => {
    if (e.target.matches && e.target.matches('details.archive')) ui.archiveOpen[e.target.dataset.col] = e.target.open;
  }, true);

  let confirmTimer;
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const col = KINDS[ui.tab].col, id = b.dataset.id, a = b.dataset.a;
    if (a !== 'askdel') ui.confirm = null;
    switch (a) {
      case 'learn':
        strike(4);
        patch(col, id, { status: 'learned', learnedAt: Date.now() });
        toast(`“${find(col, id)?.name ?? 'Item'}” moved to the archive.`);
        break;
      case 'up': move(col, id, -1); break;
      case 'down': move(col, id, 1); break;
      case 'start': {
        strike(2);
        const ids = views(col).active.map(x => x.id).filter(x => x !== id);
        reorder(col, [id, ...ids]);
        break;
      }
      case 'revive':
        patch(col, id, { status: 'active', order: maxOrder(col) + 1, learnedAt: null });
        toast(`“${find(col, id)?.name ?? 'Item'}” is back in Up Next.`);
        break;
      case 'askdel':
        ui.confirm = col + ':' + id; render();
        clearTimeout(confirmTimer); confirmTimer = setTimeout(() => { ui.confirm = null; render(); }, 3500);
        break;
      case 'del':
        state[col] = state[col].filter(x => x.id !== id);
        send({ action: 'remove', col, id });
        break;
      case 'rerollDrill': reroll('drills'); break;
    }
  });

  todBtn.addEventListener('click', () => reroll('songs'));

  const pinnedEl = document.querySelector('.pinned');
  function goTab(e) {
    const t = e.target.closest('[data-tab]'); if (!t) return;
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    if (e.type === 'keydown') e.preventDefault();
    ui.tab = t.dataset.tab; ui.confirm = null;
    try { localStorage.setItem('woodshed-tab', ui.tab); } catch (err) {}
    render(); window.scrollTo({ top: 0 });
  }
  pinnedEl.addEventListener('click', goTab);
  pinnedEl.addEventListener('keydown', goTab);

  const toastEl = document.getElementById('toast'); let tt;
  function toast(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(tt); tt = setTimeout(() => toastEl.hidden = true, 2800); }

  /* ---------- boot ---------- */
  loadLocal();           // show the last copy instantly
  if (state.songs.length || state.drills.length) ui.loaded = true;
  render();
  fetchAll();
  // Pick up edits made in the sheet (or on another device) when you come back to the app.
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && pending === 0) fetchAll(); });
  setTimeout(() => strike(3), 300);
})();
</script>
</body>
</html>
